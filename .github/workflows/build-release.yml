name: Build Release APK

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Copy www ke assets
        run: |
          cp -r www/* android/app/src/main/assets/

      - name: Download Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/lingkar-release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ../gradle-8.4/bin/gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/app/lingkar-release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Cari APK
        id: find_apk
        run: |
          APK=$(find android -name "*.apk" -path "*release*" | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"
          ls -la "$APK" || echo "APK tidak ditemukan"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lingkar-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create Release (kalau tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:

      - name: Rename APK
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" "Lingkar-v1.1.0.apk"
          ls -la Lingkar-v1.1.0.apk

      - name: Upload ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: Lingkar v1.1.0
          body: |
            🎉 **Lingkar v1.1.0**

            Aplikasi sosial privat untuk teman terdekat.

            ### ✨ Fitur
            - ❤️ Like momen
            - 🔔 Notifikasi real-time (like & komentar)
            - 📸 Upload foto & video
            - 👥 Inner Circle, Close Circle, Community
            - 🌙 Dark/Light mode

            ### 📥 Install
            1. Download **Lingkar-v1.1.0.apk**
            2. Buka → Install
            3. Warning Play Protect → Tetap install

            ### 👨‍💻 Developer
            0xmahen

            ### 💖 Donasi
            BCA 2100172502
          files: Lingkar-v1.1.0.apk
          draft: false
          prerelease: false
          make_latest: true
