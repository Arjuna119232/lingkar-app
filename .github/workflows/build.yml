name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Copy www ke assets
        run: |
          cp -r www/* android/app/src/main/assets/

      - name: Download Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip

      - name: Buat debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK (debug + signed)
        run: |
          cd android
          ../gradle-8.4/bin/gradle assembleDebug --no-daemon

      - name: Cari APK
        id: find_apk
        run: |
          APK=$(find android -name "*.apk" | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lingkar-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
