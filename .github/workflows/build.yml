name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Info Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls $ANDROID_HOME 2>/dev/null || ls /usr/local/lib/android/sdk

      - name: Copy www ke assets
        run: |
          cp -r www/* android/app/src/main/assets/
          echo "✅ Files copied:"
          ls android/app/src/main/assets/ | head -5

      - name: Setup Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.4 || (echo "Gradle tidak ada, pakai gradle dari sistem" && which gradle)
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Cari APK
        id: find_apk
        run: |
          APK=$(find android -name "*.apk" | head -n 1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lingkar-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
