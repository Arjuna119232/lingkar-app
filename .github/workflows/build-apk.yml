name: Build APK

# Jalan otomatis tiap kali push ke branch main, dan bisa dijalankan manual dari tab Actions
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java (dibutuhkan Nitron untuk build APK)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build APK dengan Nitron
        run: npx nitron build

      - name: Cari file APK hasil build
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" -not -path "*/node_modules/*" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingkar-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Buat GitHub Release otomatis (opsional, hanya di push ke main)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lingkar Build ${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
