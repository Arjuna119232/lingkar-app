<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelajah - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="container page">
    <div class="input-wrap mb-16">
      <input type="text" id="explore-search" placeholder="Cari komunitas atau user...">
    </div>
    <div class="tabs">
      <button class="active" data-kind="community">Komunitas</button>
      <button data-kind="user">User</button>
    </div>
    <div class="tabs" style="background:none;padding:0;margin-bottom:12px">
      <button class="active" data-sort="popular" style="background:var(--surface);border:1px solid var(--border)">Populer</button>
      <button data-sort="new" style="background:var(--surface);border:1px solid var(--border)">Terbaru</button>
      <button data-sort="near" style="background:var(--surface);border:1px solid var(--border)">Terdekat</button>
    </div>
    <div id="explore-results" class="stagger"></div>
  </div>
  <div id="bottom-nav"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script>
    const Explore = {
      kind: "community",
      async init() {
        App.init({ active: "explore.html", requireAuth: true });
        document.getElementById("explore-search").addEventListener("input", Utils.debounce(() => this.load(), 300));
        document.querySelectorAll('[data-kind]').forEach(b => b.addEventListener("click", () => {
          document.querySelectorAll('[data-kind]').forEach(x => x.classList.remove("active"));
          b.classList.add("active"); this.kind = b.dataset.kind; this.load();
        }));
        document.querySelectorAll('[data-sort]').forEach(b => b.addEventListener("click", () => {
          document.querySelectorAll('[data-sort]').forEach(x => x.classList.remove("active"));
          b.classList.add("active"); this.load();
        }));
        await this.load();
      },
      async load() {
        const q = document.getElementById("explore-search").value.trim();
        const wrap = document.getElementById("explore-results");
        wrap.innerHTML = Array(3).fill('<div class="card skeleton" style="height:70px"></div>').join("");
        if (this.kind === "community") {
          let query = sb.from("circles").select("*, circle_members(count)").eq("is_public", true);
          if (q) query = query.ilike("name", `%${q}%`);
          const { data } = await query.limit(20);
          wrap.innerHTML = (data || []).length ? data.map(c => `
            <a href="circle-detail.html?id=${c.id}" class="card" style="display:flex;gap:12px;align-items:center">
              <img class="avatar" src="${c.avatar_url || "assets/logo.svg"}">
              <div style="flex:1"><div style="font-weight:600">${Utils.escapeHtml(c.name)}</div>
              <div class="text-dim" style="font-size:12px">${Utils.escapeHtml(c.description || "")}</div></div>
            </a>`).join("") : `<div class="empty-state"><i class="fa-regular fa-compass"></i><p>Belum ada komunitas ditemukan.</p></div>`;
        } else {
          let query = sb.from("profiles").select("*");
          if (q) query = query.ilike("username", `%${q}%`);
          const { data } = await query.limit(20);
          wrap.innerHTML = (data || []).length ? data.map(u => `
            <a href="user-profile.html?id=${u.id}" class="card" style="display:flex;gap:12px;align-items:center">
              <img class="avatar" src="${u.avatar_url || "assets/logo.svg"}">
              <div style="font-weight:600">${Utils.escapeHtml(u.username)}</div>
            </a>`).join("") : `<div class="empty-state"><i class="fa-regular fa-user"></i><p>Tidak ada user ditemukan.</p></div>`;
        }
      }
    };
    Explore.init();
  </script>
</body>
</html>
