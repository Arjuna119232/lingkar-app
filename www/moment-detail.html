<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Momen - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<style>
  /* Info card 7 hari */
  .expiry-banner {
    background: linear-gradient(135deg, rgba(255, 149, 0, 0.1), rgba(255, 59, 48, 0.1));
    border: 1px solid rgba(255, 149, 0, 0.3);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #ff9500;
    line-height: 1.4;
  }
  .expiry-banner i {
    font-size: 16px;
    flex-shrink: 0;
  }

  /* Tombol hapus */
  .btn-delete-moment {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px;
    margin-top: 16px;
    background: rgba(255, 59, 48, 0.1);
    border: 1px solid rgba(255, 59, 48, 0.3);
    color: #ff3b30;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-delete-moment:active {
    transform: scale(0.98);
    background: rgba(255, 59, 48, 0.2);
  }

  /* Modal konfirmasi */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.2s;
  }
  .modal-overlay.show .modal-box {
    transform: scale(1);
  }
  .modal-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(255, 59, 48, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 28px;
    color: #ff3b30;
  }
  .modal-box h3 {
    font-size: 18px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .modal-box p {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.15s;
  }
  .modal-btn:active { transform: scale(0.97); }
  .modal-btn-cancel {
    background: var(--surface-2);
    color: var(--text);
  }
  .modal-btn-delete {
    background: #ff3b30;
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="container page no-nav no-header" id="moment-wrap">
    <a href="javascript:history.back()" class="text-dim">
      <i class="fa-solid fa-arrow-left"></i> Kembali
    </a>

    <div id="m-media" class="moment-media mt-16" style="aspect-ratio:auto;max-height:420px"></div>

    <div class="card-top mt-16">
      <img id="m-avatar" class="avatar" src="assets/logo.svg">
      <div class="who">
        <div class="uname" id="m-username"></div>
        <div class="time" id="m-time"></div>
      </div>
    </div>

    <p id="m-caption" class="moment-caption"></p>

    <div class="moment-actions">
      <span class="act" id="btn-like"><i class="fa-regular fa-heart"></i> Suka</span>
      <span class="act" id="btn-share"><i class="fa-regular fa-paper-plane"></i> Bagikan</span>
      <span class="act" id="btn-save"><i class="fa-solid fa-download"></i> Simpan</span>
    </div>

    <!-- Banner info 7 hari -->
    <div class="expiry-banner">
      <i class="fa-solid fa-clock"></i>
      <span>Momen ini akan dihapus otomatis <strong>7 hari</strong> setelah diposting. Simpan ke galeri kalau penting!</span>
    </div>

    <!-- Tombol hapus (hanya muncul kalau momen milik user) -->
    <button class="btn-edit-caption" id="btn-edit-caption" style="display:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;margin-top:16px;background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.3);color:var(--primary);border-radius:12px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all 0.2s">
      <i class="fa-solid fa-pen"></i> Edit Caption
    </button>
    <button class="btn-delete-moment" id="btn-delete" style="display:none">
      <i class="fa-solid fa-trash"></i>
      Hapus Momen Ini
    </button>

    <h3 class="mt-24 mb-8" style="font-size:14px">Komentar</h3>
    <div id="comment-list"></div>

    <form id="comment-form" style="display:flex;gap:8px;margin-top:16px;position:sticky;bottom:12px">
      <div class="input-wrap" style="flex:1">
        <input name="text" placeholder="Tulis komentar...">
      </div>
      <button type="submit" class="btn" style="width:auto;padding:12px 18px">
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </form>
  </div>

  <!-- Modal konfirmasi hapus -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-box">
      <div class="modal-icon">
        <i class="fa-solid fa-trash"></i>
      </div>
      <h3>Hapus momen ini?</h3>
      <p>Momen akan dihapus permanen dari HP kamu dan tidak bisa dikembalikan.</p>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" id="btn-cancel-delete">Batal</button>
        <button class="modal-btn modal-btn-delete" id="btn-confirm-delete">Hapus</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/moment.js"></script>
  <script>MomentDetail.init();</script>

  <!-- Modal Edit Caption -->
  <div class="modal-overlay" id="edit-caption-modal">
    <div class="modal-box">
      <h3 style="font-size:18px;color:var(--text);margin-bottom:16px;text-align:center">Edit Caption</h3>
      <textarea id="edit-caption-input" maxlength="200" placeholder="Tulis caption baru..." style="width:100%;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;resize:none;min-height:100px;margin-bottom:8px"></textarea>
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;text-align:right"><span id="edit-caption-count">0</span>/200</div>
      <div style="display:flex;gap:10px">
        <button class="modal-btn" id="btn-cancel-edit" style="flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:var(--surface-2);color:var(--text);cursor:pointer">Batal</button>
        <button class="modal-btn" id="btn-save-edit" style="flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:#8b5cf6;color:var(--text);cursor:pointer">Simpan</button>
      </div>
    </div>
  </div>

</body>
</html>
