<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="container page">
    <div class="tabs">
      <button class="active" data-filter="all">Semua</button>
      <button data-filter="inner">Inner</button>
      <button data-filter="close">Close</button>
      <button data-filter="community">Community</button>
    </div>
    <div id="feed-list" class="stagger" style="overflow-y:auto"></div>
  </div>
  <div id="bottom-nav"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/feed.js"></script>
  <script>Feed.init();</script>

  <!-- Modal Hapus Momen -->
  <div class="modal-overlay" id="delete-modal">
    <div class="modal-box">
      <div class="modal-icon" style="width:60px;height:60px;border-radius:50%;background:rgba(255,59,48,0.15);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;color:#ff3b30">
        <i class="fa-solid fa-trash"></i>
      </div>
      <h3 style="font-size:18px;color:var(--text);margin-bottom:8px;text-align:center">Hapus momen ini?</h3>
      <p style="font-size:13px;color:var(--text-dim);line-height:1.5;margin-bottom:20px;text-align:center">Momen akan dihapus permanen dan tidak bisa dikembalikan.</p>
      <div style="display:flex;gap:10px">
        <button class="modal-btn" id="btn-cancel-delete" style="flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:var(--surface-2);color:var(--text);cursor:pointer">Batal</button>
        <button class="modal-btn" id="btn-confirm-delete" style="flex:1;padding:12px;border:none;border-radius:10px;font-size:14px;font-weight:600;background:#ff3b30;color:var(--text);cursor:pointer">Hapus</button>
      </div>
    </div>
  </div>

  <style>
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px;
      max-width: 340px; width: 100%;
      transform: scale(0.9); transition: transform 0.2s;
    }
    .modal-overlay.show .modal-box { transform: scale(1); }
  </style>

</body>
</html>
