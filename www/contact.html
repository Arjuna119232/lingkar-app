<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kontak - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="container page no-nav no-header">
    <a href="settings.html" class="text-dim"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
    <h1 style="font-size:18px;font-weight:800;margin:16px 0">Hubungi Kami</h1>
    <form id="contact-form">
      <div class="field"><label>Nama</label><div class="input-wrap"><input name="name" required></div></div>
      <div class="field"><label>Email</label><div class="input-wrap"><input type="email" name="email" required></div></div>
      <div class="field"><label>Subjek</label><div class="input-wrap"><input name="subject" required></div></div>
      <div class="field"><label>Pesan</label><textarea name="message" required placeholder="Tulis pesanmu..."></textarea></div>
      <button type="submit" class="btn">Kirim</button>
    </form>
    <div class="card mt-24">
      <p style="font-size:13px"><i class="fa-solid fa-envelope text-primary"></i> hello@lingkar.app</p>
      <p style="font-size:13px;margin-top:8px"><i class="fa-brands fa-instagram text-primary"></i> @lingkar.app</p>
      <p style="font-size:13px;margin-top:8px"><i class="fa-brands fa-x-twitter text-primary"></i> @lingkarapp</p>
    </div>
  </div>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/settings.js"></script>
  <script>ContactForm.init();</script>
</body>
</html>
