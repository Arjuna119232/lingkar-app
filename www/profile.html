<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .cover{height:110px;border-radius:16px;background:linear-gradient(135deg,var(--primary),#8E7CF0);margin-bottom:-44px}
</style>
</head>
<body>
  <div id="app-header"></div>
  <div class="container page">
    <div class="cover"></div>
    <div style="text-align:center">
      <img id="p-avatar" class="avatar avatar-lg" style="margin:0 auto" src="assets/logo.svg">
      <div style="font-weight:700;font-size:16px;margin-top:8px" id="p-username">@username</div>
      <p class="text-dim" id="p-bio" style="font-size:13px;margin-top:4px">Bio</p>
      <div style="display:flex;justify-content:center;gap:28px;margin:18px 0">
        <div><div style="font-weight:700" id="stat-posts">0</div><div class="text-dim" style="font-size:11px">Postingan</div></div>
        <div><div style="font-weight:700" id="stat-circles">0</div><div class="text-dim" style="font-size:11px">Lingkaran</div></div>
        <div><div style="font-weight:700" id="stat-friends">0</div><div class="text-dim" style="font-size:11px">Teman</div></div>
      </div>
      <div style="display:flex;gap:10px">
        <a href="edit-profile.html" class="btn btn-outline btn-sm" style="flex:1">Edit Profil</a>
        <a href="settings.html" class="btn btn-outline btn-sm" style="flex:1">Pengaturan</a>
      </div>
    </div>
    <div class="tabs mt-24">
      <button class="active" data-tab="posts">Postingan</button>
      <button data-tab="circles">Lingkaran</button>
      <button data-tab="liked">Disukai</button>
    </div>
    <div class="grid-3" id="profile-grid"></div>
    <button class="btn btn-outline mt-24" id="btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
  </div>
  <div id="bottom-nav"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
  <script>Profile.init();</script>
</body>
</html>
