<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lingkar</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="center-screen fade-in">
    <img src="assets/logo.svg" style="width:88px;height:88px" alt="Lingkar">
    <h1 style="margin-top:16px;font-size:22px;font-weight:800;color:var(--primary)">Lingkar</h1>
    <p class="text-dim mt-8">Ruang kecil untuk teman terdekat</p>
    <div class="spinner spinner-dark mt-24"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script>
    (async () => {
      await new Promise(r => setTimeout(r, 1200));
      const session = await DB.getSession().catch(() => null);
      const seen = localStorage.getItem("lingkar_onboarded");
      if (session) location.href = "feed.html";
      else if (seen) location.href = "login.html";
      else location.href = "onboarding.html";
    })();
  </script>
</body>
</html>
