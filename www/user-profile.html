<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profil - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<style>.cover{height:110px;border-radius:16px;background:linear-gradient(135deg,var(--close),#8fd0ff);margin-bottom:-44px}</style>
</head>
<body>
  <div class="container page no-nav no-header">
    <a href="javascript:history.back()" class="text-dim"><i class="fa-solid fa-arrow-left"></i> Kembali</a>
    <div class="cover mt-8"></div>
    <div style="text-align:center">
      <img id="u-avatar" class="avatar avatar-lg" style="margin:0 auto" src="assets/logo.svg">
      <div style="font-weight:700;font-size:16px;margin-top:8px" id="u-username">@username</div>
      <p class="text-dim" id="u-bio" style="font-size:13px;margin-top:4px"></p>
      <div style="display:flex;justify-content:center;gap:28px;margin:18px 0">
        <div><div style="font-weight:700" id="u-stat-posts">0</div><div class="text-dim" style="font-size:11px">Postingan</div></div>
        <div><div style="font-weight:700" id="u-stat-friends">0</div><div class="text-dim" style="font-size:11px">Teman</div></div>
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-sm" id="btn-follow" style="flex:1">Ikuti</button>
        <button class="btn btn-outline btn-sm" style="flex:1" disabled>Kirim Pesan</button>
      </div>
    </div>
    <div class="grid-3 mt-24" id="u-grid"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script>
    (async function () {
      App.init({ nav: false, requireAuth: true });
      const me = await DB.getUser();
      const id = Utils.qs("id");
      const profile = await DB.getProfile(id);
      document.getElementById("u-avatar").src = profile.avatar_url || "assets/logo.svg";
      document.getElementById("u-username").textContent = "@" + profile.username;
      document.getElementById("u-bio").textContent = profile.bio || "";
      const { count: posts } = await sb.from("moments").select("id", { count: "exact", head: true }).eq("user_id", id);
      const { count: friends } = await sb.from("follows").select("id", { count: "exact", head: true }).eq("following_id", id);
      document.getElementById("u-stat-posts").textContent = posts ?? 0;
      document.getElementById("u-stat-friends").textContent = friends ?? 0;
      const { data: existing } = await sb.from("follows").select("id").eq("follower_id", me.id).eq("following_id", id).maybeSingle();
      const btn = document.getElementById("btn-follow");
      let following = !!existing;
      const render = () => btn.textContent = following ? "Mengikuti" : "Ikuti";
      render();
      btn.onclick = async () => {
        if (following) await sb.from("follows").delete().eq("follower_id", me.id).eq("following_id", id);
        else await sb.from("follows").insert({ follower_id: me.id, following_id: id });
        following = !following; render();
      };
      const { data: moments } = await sb.from("moments").select("*").eq("user_id", id).order("created_at", { ascending: false });
      document.getElementById("u-grid").innerHTML = (moments || []).length
        ? moments.map(m => `<div class="cell">${m.media_type === "video" ? `<video src="${m.media_url}" muted></video>` : `<img src="${m.media_url}">`}</div>`).join("")
        : `<div class="empty-state" style="grid-column:1/-1"><i class="fa-regular fa-image"></i><p>Belum ada postingan.</p></div>`;
    })();
  </script>
</body>
</html>
