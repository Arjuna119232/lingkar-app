<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Posting Momen - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .media-picker {
    display: grid !important;
    grid-template-columns: 1fr 1fr 1fr !important;
    gap: 8px !important;
    margin-bottom: 16px !important;
    background: #1a1a1a !important;
    padding: 4px !important;
    border-radius: 12px !important;
    position: relative !important;
    z-index: 10 !important;
  }
  .media-picker .media-btn {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    padding: 10px 12px !important;
    border: none !important;
    background: transparent !important;
    color: #888888 !important;
    border-radius: 9px !important;
    font-size: 13px !important;
    font-weight: 500 !important;
    font-family: inherit !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
    -webkit-tap-highlight-color: transparent !important;
    pointer-events: auto !important;
    min-height: 40px !important;
    width: 100% !important;
  }
  .media-picker .media-btn i { font-size: 14px !important; pointer-events: none !important; }
  .media-picker .media-btn span { pointer-events: none !important; }
  .media-picker .media-btn:active { transform: scale(0.97) !important; }
  .media-picker .media-btn.btn-image.active {
    background: rgba(0, 122, 255, 0.15) !important;
    color: #007aff !important;
  }
  .media-picker .media-btn.btn-video.active {
    background: rgba(255, 59, 48, 0.15) !important;
    color: #ff3b30 !important;
  }
  .media-picker .media-btn.btn-camera.active {
    background: rgba(52, 199, 89, 0.15) !important;
    color: #34c759 !important;
  }
  .media-picker .media-btn.btn-camera i {
    color: #34c759;
  }
  .media-picker .media-btn.btn-camera span {
    color: #34c759;
  }
  #preview-area {
    background: #1a1a1a !important;
    border-radius: 12px !important;
    min-height: 180px !important;
    max-height: 340px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    margin-bottom: 12px !important;
    overflow: hidden !important;
    position: relative !important;
  }
</style>
  <!-- Cropper.js untuk crop foto -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
  <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
</head>
<body>
  <div id="app-header"></div>

  <form class="container page" id="upload-form" enctype="multipart/form-data" novalidate>
    <div id="preview-area">
      <i class="fa-regular fa-image" id="preview-icon" style="font-size:28px;color:#888888"></i>
      <img id="preview-img" src="" alt="" style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;border-radius:12px">
      <video id="preview-video" controls muted playsinline style="display:none;width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;border-radius:12px"></video>
    </div>

    <input type="file" id="media-input-image" accept="image/*" class="hidden">
    <input type="file" id="media-input-video" accept="video/*" class="hidden">
    <input type="file" id="media-input-camera" accept="image/*,video/*" capture="environment" class="hidden">

    <div class="media-picker">
      <button type="button" class="media-btn btn-image" id="pick-image">
        <i class="fa-solid fa-camera"></i><span>Foto</span>
      </button>
      <button type="button" class="media-btn btn-video" id="pick-video">
        <i class="fa-solid fa-video"></i><span>Video</span>
      </button>
      <button type="button" class="media-btn btn-camera" id="pick-camera">
        <i class="fa-solid fa-camera-retro"></i><span>Kamera</span>
      </button>
    </div>

    <div class="field">
      <label for="caption">Caption</label>
      <textarea id="caption" maxlength="200" placeholder="Ceritakan momen ini..."></textarea>
      <div class="char-counter" id="caption-count">0/200</div>
    </div>

    <div class="field">
      <label>Bagikan ke lingkaran</label>
      <div id="circle-checks"></div>
    </div>

    <div id="progress" class="progress-bar hidden"><div class="fill"></div></div>

    <button type="submit" class="btn mt-16" id="btn-submit">
      <i class="fa-solid fa-paper-plane"></i> Posting
    </button>
    <button type="button" class="btn btn-outline mt-8" id="btn-cancel">
      <i class="fa-solid fa-xmark"></i> Batal
    </button>
  </form>

  <div id="bottom-nav"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lib/browser-image-compression.js"></script>
  <script src="js/upload.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof Upload !== 'undefined' && Upload.init) Upload.init();
      else console.error('❌ Upload module tidak ditemukan');
    });
  </script>
  <!-- Modal Crop Foto -->
  <div id="crop-modal" class="crop-modal">
    <div class="crop-header">
      <button id="crop-cancel" class="crop-btn">Batal</button>
      <div class="crop-title">Atur Foto</div>
      <button id="crop-apply" class="crop-btn crop-btn-primary">Terapkan</button>
    </div>
    <div class="crop-body">
      <img id="crop-image" src="" alt="">
    </div>
    <div class="crop-footer">
      <button id="crop-rotate" class="crop-tool"><i class="fa-solid fa-rotate-right"></i> Putar</button>
      <button id="crop-reset" class="crop-tool"><i class="fa-solid fa-rotate-left"></i> Reset</button>
      <button id="crop-ratio" class="crop-tool"><i class="fa-solid fa-crop"></i> 4:5</button>
    </div>
  </div>

</body>
</html>
