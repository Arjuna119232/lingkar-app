<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="container page no-nav no-header fade-in" style="padding-top:60px">
    <div style="text-align:center;margin-bottom:32px">
      <img src="assets/logo.svg" style="width:64px;height:64px;margin:0 auto">
      <h1 style="font-size:20px;font-weight:800;margin-top:12px">Masuk ke Lingkar</h1>
    </div>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <div class="input-wrap"><input type="email" name="email" required placeholder="nama@email.com"></div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" name="password" required placeholder="Password kamu">
          <i class="fa-solid fa-eye toggle-eye" id="toggle-pw"></i>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <label class="checkbox-row"><input type="checkbox" name="remember"><span>Ingat saya</span></label>
        <a href="forgot-password.html" class="text-primary" style="font-size:13px">Lupa password?</a>
      </div>
      <button type="submit" class="btn" id="btn-login">Masuk</button>
    </form>
    <div class="divider-text">atau</div>
    <button class="btn btn-outline" disabled><i class="fa-brands fa-google"></i> Masuk dengan Google</button>
    <p class="text-dim mt-24" style="text-align:center;font-size:13px">
      Belum punya akun? <a href="register.html" class="text-primary">Daftar</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>App.applyTheme(); Auth.initLogin();</script>
</body>
</html>
