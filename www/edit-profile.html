<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edit Profil - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="container page no-nav no-header">
    <a href="profile.html" style="display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;font-size:14px;text-decoration:none;color:var(--text-dim)">
      <i class="fa-solid fa-arrow-left"></i> Kembali
    </a>
    <h1 style="font-size:18px;font-weight:800;margin:16px 0">Edit Profil</h1>
    <div style="text-align:center;margin-bottom:20px">
      <img id="e-avatar" class="avatar avatar-lg" style="margin:0 auto" src="assets/logo.svg">
      <input type="file" id="avatar-input" accept="image/*" class="hidden">
      <button type="button" class="btn-ghost mt-8" style="background:none;border:none" onclick="document.getElementById('avatar-input').click()">Ganti Foto</button>
    </div>
    <form id="edit-form">
      <div class="field"><label>Username</label><div class="input-wrap"><input name="username" required></div></div>
      <div class="field"><label>Nama Lengkap</label><div class="input-wrap"><input name="full_name"></div></div>
      <div class="field"><label>Bio</label><textarea name="bio" maxlength="150" placeholder="Ceritakan sedikit tentang kamu"></textarea></div>
      <div class="field"><label>Tanggal Lahir</label><div class="input-wrap"><input type="date" name="birth_date"></div></div>
      <div class="field">
        <label>Jenis Kelamin</label>
        <div class="input-wrap"><select name="gender"><option value="">Pilih</option><option value="male">Laki-laki</option><option value="female">Perempuan</option><option value="other">Lainnya</option></select></div>
      </div>
      <button type="submit" class="btn" id="btn-save">Simpan</button>
      <a href="profile.html" class="btn btn-outline mt-8" style="display:block;text-align:center">Batal</a>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
  <script>EditProfile.init();</script>
</body>
</html>
