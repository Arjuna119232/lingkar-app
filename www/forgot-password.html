<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lupa Password - Lingkar</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="container page no-nav no-header fade-in" style="padding-top:60px">
    <div style="text-align:center;margin-bottom:28px">
      <i class="fa-solid fa-key" style="font-size:36px;color:var(--primary)"></i>
      <h1 style="font-size:20px;font-weight:800;margin-top:12px">Lupa Password</h1>
      <p class="text-dim mt-8" style="font-size:13px">Masukkan email kamu, kami kirim link untuk reset password.</p>
    </div>
    <form id="forgot-form">
      <div class="field">
        <label>Email</label>
        <div class="input-wrap"><input type="email" name="email" required placeholder="nama@email.com"></div>
      </div>
      <button type="submit" class="btn" id="btn-forgot">Kirim link reset</button>
    </form>
    <p class="text-dim mt-24" style="text-align:center;font-size:13px">
      <a href="login.html" class="text-primary">&larr; Kembali ke halaman masuk</a>
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/local-storage.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-handler.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>App.applyTheme(); Auth.initForgot();</script>
</body>
</html>
